name: demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthy:
    name: healthy server passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: probe
        uses: clytie0x/mcp-loadtest@v0.6.0
        with:
          server: python3 server.py
      - name: Report says passed
        run: test "${{ steps.probe.outputs.passed }}" = "true"

  deadlock:
    name: deadlocking server fails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Expected to fail; the next step turns that failure into this job's pass.
      - id: probe
        continue-on-error: true
        uses: clytie0x/mcp-loadtest@v0.6.0
        with:
          server: python3 server.py --deadlock
      - name: The probe caught the deadlock
        run: |
          test "${{ steps.probe.outcome }}" = "failure"
          test "${{ steps.probe.outputs.passed }}" = "false"
